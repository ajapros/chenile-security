server:
  port: 9000

spring:
  application:
    name: auth-server
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${CHENILE_SECURITY_DB_HOST:localhost}:${CHENILE_SECURITY_DB_PORT:5432}/${CHENILE_SECURITY_DB_NAME:auth_server}}
    username: ${SPRING_DATASOURCE_USERNAME:${CHENILE_SECURITY_DB_USERNAME:auth_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${CHENILE_SECURITY_DB_PASSWORD:auth_pass}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

chenile:
  security:
    issuer-base: ${CHENILE_SECURITY_ISSUER_BASE:http://localhost:9000}
    demo-ui:
      success-uri: ${CHENILE_SECURITY_DEMO_UI_SUCCESS_URI:http://localhost:5173/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
